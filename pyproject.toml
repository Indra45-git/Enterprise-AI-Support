[project]
name = "enterprise-ai-support"
version = "0.1.0"
description = "Enterprise AI Customer Support Agent & Embeddable Chatbot SaaS"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
]

[tool.uv]
package = false

[tool.pyrefly]
search-path = ["backend"]

[tool.pyright]
extraPaths = ["backend"]

