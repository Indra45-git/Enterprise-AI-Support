# Full production topology per the spec. The backend itself runs fine standalone
# (SQLite + in-memory rate-limit/idempotency + heuristic guardrails) for local dev;
# this compose file wires in the real Postgres/pgvector + Redis when you're ready.
version: "3.9"
services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://user:pass@postgres:5432/support_agent
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

volumes:
  pgdata:
